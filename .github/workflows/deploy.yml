# =============================================================================
# Deploy Pipeline - Build e Deploy para GitHub Pages
# =============================================================================
# Princípios: DRY (reutiliza artefatos), KISS (deploy simples), SOLID (responsabilidade única)
# =============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Descomente as permissões abaixo quando o GitHub Pages estiver habilitado
# permissions:
#   contents: read
#   pages: write
#   id-token: write

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  BUILD_PATH: '.'

jobs:
  # ===========================================================================
  # Build - Gera o site estático
  # ===========================================================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    # Remova o 'if' abaixo quando o GitHub Pages estiver habilitado
    if: false  # Desabilitado até configurar Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build Astro site
        run: |
          pnpm astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        working-directory: ${{ env.BUILD_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  # ===========================================================================
  # Deploy - Publica no GitHub Pages
  # ===========================================================================
  deploy:
    name: 🚀 Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
