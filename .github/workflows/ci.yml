# =============================================================================
# CI Pipeline - Validação e Qualidade de Código
# =============================================================================
# Princípios: DRY (jobs reutilizáveis), KISS (steps simples), YAGNI (só o necessário)
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ===========================================================================
  # Conventional Commits - Valida commit messages
  # ===========================================================================
  commits:
    name: 📝 Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Validate conventional commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PR: check commits in the PR
            while IFS= read -r commit; do
              echo "Validating: $commit"
              git log -1 --pretty=%B "$commit" | npx commitlint -x conventional || exit 1
            done < <(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            # For push: check the last commit on main
            npx commitlint -x conventional --from HEAD~1 --to HEAD || exit 1
          fi

  # ===========================================================================
  # Setup - Instala dependências (reutilizado por outros jobs via cache)
  # ===========================================================================
  setup:
    name: 📦 Setup
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Generate cache key
        id: cache-key
        run: echo "key=pnpm-${{ hashFiles('pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ===========================================================================
  # Lint - ESLint, Prettier, TypeScript
  # ===========================================================================
  lint:
    name: 🔍 Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run Prettier check
        run: pnpm format:check

      - name: Generate Astro types
        run: pnpm astro sync

      - name: TypeScript type check
        run: pnpm typecheck

  # ===========================================================================
  # Security - SAST, Dependency Audit, Secrets Scanning
  # ===========================================================================
  security:
    name: 🔒 Security
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # Gitleaks removido - requer licença para organizações
      # Para adicionar: configure GITLEAKS_LICENSE no GitHub Secrets
      # Ref: https://github.com/gitleaks/gitleaks-action

  # ===========================================================================
  # Accessibility - Validação a11y
  # ===========================================================================
  accessibility:
    name: ♿ Accessibility
    needs: [setup, build-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Run Lighthouse CI
        run: |
          npx @lhci/cli@0.13.x autorun || true

  # ===========================================================================
  # Build Check - Verifica se o build funciona
  # ===========================================================================
  build-check:
    name: 🏗️ Build Check
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 1
