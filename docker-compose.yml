version: '3.8'

services:
  # Development server
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: integr8-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: pnpm dev
    networks:
      - integr8

  # Production build preview
  preview:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integr8-preview
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    networks:
      - integr8

networks:
  integr8:
    driver: bridge
